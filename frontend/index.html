<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>MovieTayo — Your AI-Powered Movie Library</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="api-config.js"></script>
  <script src="local-catalog.js"></script>
  <script src="local-backend.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

    :root {
      --bg-color: #020617;
      --card-bg: #0f172a;
      --accent: #3b82f6;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
    }

    .glass-nav {
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .hero-gradient {
      background: linear-gradient(to bottom, rgba(2, 6, 23, 0) 0%, rgba(2, 6, 23, 0.8) 70%, rgba(2, 6, 23, 1) 100%);
    }

    .card-zoom:active {
      transform: scale(0.96);
    }

    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-in {
      animation: fadeIn 0.4s ease-out forwards;
    }

    .tab-active {
      color: var(--accent);
    }

    .tab-active i {
      transform: translateY(-2px);
      filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.5));
    }

    .skeleton {
      background: linear-gradient(90deg, #0f172a 25%, #1e293b 50%, #0f172a 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
    }

    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body class="selection:bg-blue-500/30">

  <!-- Mobile Top Bar -->
  <header class="fixed top-0 left-0 right-0 z-40 px-6 py-4 flex items-center justify-between glass-nav md:hidden">
    <div class="flex items-center gap-2">
      <img src="Logo.png" alt="MovieTayo Logo" class="w-8 h-8 object-contain">
      <span class="font-bold text-lg tracking-tight">Movie<span class="text-blue-500">Tayo</span></span>
    </div>
    <button onclick="toggleSearch()" class="w-10 h-10 rounded-full bg-slate-900 flex items-center justify-center border border-slate-800">
      <i class="fas fa-search text-slate-400"></i>
    </button>
    <button onclick="openReport()" class="w-10 h-10 rounded-full bg-slate-900 flex items-center justify-center border border-slate-800">
      <i class="fas fa-flag text-slate-400"></i>
    </button>
  </header>

  <!-- Desktop Sidebar -->
  <aside class="hidden md:flex fixed left-0 top-0 bottom-0 w-64 flex-col bg-slate-950 border-r border-slate-900 p-6 z-50">
    <div class="flex items-center gap-3 mb-10 px-2">
      <img src="Logo.png" alt="MovieTayo Logo" class="w-10 h-10 object-contain">
      <span class="font-extrabold text-xl tracking-tight text-white">Movie<span class="text-blue-500">Tayo</span></span>
    </div>

    <nav class="space-y-2 flex-1">
      <button onclick="showTab('explore')" id="dt-tab-explore" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-900 hover:text-white transition-all font-medium text-left">
        <i class="fas fa-compass w-5"></i> Explore
      </button>
      <button onclick="showTab('recs')" id="dt-tab-recs" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-900 hover:text-white transition-all font-medium text-left">
        <i class="fas fa-sparkles w-5"></i> For You
      </button>
      <button onclick="showTab('library')" id="dt-tab-library" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-900 hover:text-white transition-all font-medium text-left">
        <i class="fas fa-bookmark w-5"></i> My Library
      </button>
      <button onclick="openReport()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-900 hover:text-white transition-all font-medium text-left">
        <i class="fas fa-flag w-5"></i> Report
      </button>
    </nav>

    <div class="mt-auto p-4 bg-slate-900/50 rounded-2xl border border-slate-800">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-2 h-2 rounded-full bg-green-500" id="dt-status-dot"></div>
        <span class="text-xs font-bold uppercase tracking-wider text-slate-500" id="dt-status-text">Ready</span>
      </div>
      <p class="text-[10px] text-slate-500 leading-tight">Backend: <span id="backend-url">checking</span></p>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="md:ml-64 min-h-screen pb-24 md:pb-8">

    <!-- Hero Section -->
    <section id="hero" class="relative h-[45vh] md:h-[55vh] overflow-hidden">
      <div class="absolute inset-0 bg-[url('https://image.tmdb.org/t/p/w1280/gajva2L0rPYkEWjzgFlBXCAVBE5.jpg')] bg-cover bg-center scale-105"></div>
      <div class="absolute inset-0 hero-gradient"></div>
      <div class="absolute bottom-0 left-0 right-0 p-6 md:p-12">
        <span class="bg-blue-600 text-[10px] font-black px-2 py-1 rounded mb-4 inline-block uppercase tracking-widest text-white">Featured</span>
        <h1 class="text-4xl md:text-6xl font-black mb-4 tracking-tighter text-white">Blade Runner 2049</h1>
        <div class="flex items-center gap-4 mb-6 text-slate-300">
          <span class="text-sm font-semibold text-white">2017</span>
          <span class="w-1 h-1 rounded-full bg-slate-500"></span>
          <span class="text-sm font-semibold text-white">Sci-Fi / Action</span>
        </div>
      </div>
    </section>

    <!-- Popular Movies Slidebar -->
    <section class="px-6 py-4 bg-slate-950/50 border-b border-slate-800">
      <h3 class="text-sm font-bold text-white mb-3 flex items-center gap-2">
        <i class="fas fa-fire text-orange-500"></i> Popular Now
      </h3>
      <div id="popularMovies" class="flex gap-3 overflow-x-auto no-scrollbar pb-2">
        <!-- Popular movies will be loaded here -->
        <div class="flex gap-3">
          <div class="flex-shrink-0 w-24 aspect-[2/3] rounded-xl bg-slate-800 animate-pulse"></div>
          <div class="flex-shrink-0 w-24 aspect-[2/3] rounded-xl bg-slate-800 animate-pulse"></div>
          <div class="flex-shrink-0 w-24 aspect-[2/3] rounded-xl bg-slate-800 animate-pulse"></div>
          <div class="flex-shrink-0 w-24 aspect-[2/3] rounded-xl bg-slate-800 animate-pulse"></div>
          <div class="flex-shrink-0 w-24 aspect-[2/3] rounded-xl bg-slate-800 animate-pulse"></div>
        </div>
      </div>
    </section>

    <div class="px-6 py-8">

      <!-- Search Bar -->
      <div id="searchContainer" class="hidden md:block mb-10 sticky top-4 z-30 transition-all duration-300">
        <div class="relative max-w-2xl">
          <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-500"></i>
          <input id="search" type="text" placeholder="Search movies, series, or anime..."
            class="w-full bg-slate-900 border border-slate-800 rounded-2xl py-4 pl-14 pr-6 focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all text-sm shadow-2xl text-white" />
        </div>
      </div>

      <!-- Explore Section -->
      <section id="sec-explore" class="tab-content animate-in text-left">
        <h2 class="text-2xl font-bold tracking-tight mb-6 text-white">Browse Catalog</h2>
        <div id="searchResults" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6"></div>
      </section>

      <!-- Library Section -->
      <section id="sec-library" class="tab-content hidden animate-in text-left">
        <div class="flex items-center justify-between mb-6 pt-12 md:pt-0">
          <h2 class="text-2xl font-bold tracking-tight text-white">My Library</h2>
          <span id="libraryCount" class="text-sm font-bold text-slate-500 text-white">0 items</span>
        </div>
        <div id="savedList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
      </section>

      <!-- Recommendations Section -->
      <section id="sec-recs" class="tab-content hidden animate-in text-left">
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 pt-12 md:pt-0 gap-4">
          <div>
            <h2 class="text-2xl font-bold tracking-tight mb-1 text-white">Made For You</h2>
            <p class="text-slate-400 text-xs text-white/70">Based on your library and reflections</p>
          </div>
          <div class="flex items-center gap-3">
             <select id="limit" class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 text-xs focus:outline-none text-white">
                <option value="5">5 results</option>
                <option value="10" selected>10 results</option>
              </select>
              <button id="btnRecommend" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2">
                <i class="fas fa-wand-magic-sparkles text-white"></i> Refresh
              </button>
          </div>
        </div>
        <div id="recsResults" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6"></div>
      </section>

    </div>
  </main>

  <!-- Library Modal -->
  <div id="reflectionOverlay" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-6 bg-slate-950/80 backdrop-blur-sm animate-in">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-3xl p-6 shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-xl font-bold tracking-tight text-white" id="modalTitle">Add to Library</h3>
        <button onclick="closeReflection()" class="text-slate-500 hover:text-white transition-colors text-white"><i class="fas fa-times text-lg"></i></button>
      </div>
      <p id="modalMovieTitle" class="text-blue-500 font-bold text-sm mb-4 uppercase tracking-widest"></p>
      <textarea id="reflectionText" placeholder="Add your notes and preferences about this movie to help the AI learn your taste..."
        class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/50 min-h-[200px] resize-none mb-6 text-white"></textarea>
      <button id="btnSaveReflection" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl transition-all shadow-lg shadow-blue-900/20 active:scale-95 text-white">
        Save to Library
      </button>
    </div>
  </div>

  <!-- Report Modal -->
  <div id="reportOverlay" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-6 bg-slate-950/80 backdrop-blur-sm animate-in">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-3xl p-6 shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-xl font-bold tracking-tight text-white">Send Report</h3>
        <button onclick="closeReport()" class="text-slate-500 hover:text-white transition-colors text-white"><i class="fas fa-times text-lg"></i></button>
      </div>
      <select id="reportCategory" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 text-sm text-white mb-4">
        <option value="bug">Bug</option>
        <option value="feedback">Feedback</option>
        <option value="movie_request">Movie request</option>
      </select>
      <textarea id="reportMessage" placeholder="Tell us what happened or what you want added..."
        class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/50 min-h-[160px] resize-none mb-6 text-white"></textarea>
      <button id="btnSendReport" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl transition-all shadow-lg shadow-blue-900/20 active:scale-95 text-white">
        Send Report
      </button>
    </div>
  </div>

  <!-- Mobile Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 glass-nav md:hidden safe-bottom">
    <div class="flex items-center justify-around py-3 px-2">
      <button onclick="showTab('explore')" id="tab-explore" class="flex flex-col items-center gap-1 text-slate-500 py-1 px-4">
        <i class="fas fa-compass text-xl"></i>
        <span class="text-[10px] font-bold uppercase tracking-widest text-white">Explore</span>
      </button>
      <button onclick="showTab('recs')" id="tab-recs" class="flex flex-col items-center gap-1 text-slate-500 py-1 px-4">
        <i class="fas fa-sparkles text-xl"></i>
        <span class="text-[10px] font-bold uppercase tracking-widest text-white">AI Picks</span>
      </button>
      <button onclick="showTab('library')" id="tab-library" class="flex flex-col items-center gap-1 text-slate-500 py-1 px-4">
        <i class="fas fa-bookmark text-xl"></i>
        <span class="text-[10px] font-bold uppercase tracking-widest text-white">Library</span>
      </button>
    </div>
  </nav>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-24 md:bottom-10 right-6 z-[60] glass-nav border border-slate-800 p-4 rounded-2xl shadow-2xl flex items-center gap-4 transition-all duration-500 translate-x-[120%] opacity-0">
    <div id="toastIcon" class="w-10 h-10 rounded-xl flex items-center justify-center"></div>
    <div>
      <h4 id="toastTitle" class="font-bold text-sm text-white"></h4>
      <p id="toastSub" class="text-xs text-slate-400 text-white"></p>
    </div>
  </div>

  <script>
    const userId = "demo";
    const $ = (id) => document.getElementById(id);
    const isAndroid = /Android/i.test(navigator.userAgent);

    // Automatically detect backend URL
    const API_BASE = window.MOVIETAYO_API_BASE || (isAndroid ? "http://10.0.2.2:8001" : "http://localhost:8001");
    const LOCAL_BACKEND = window.MOVIETAYO_LOCAL_BACKEND;
    $('backend-url').textContent = LOCAL_BACKEND?.enabled ? 'in-app local' : API_BASE.replace(/^https?:\/\//, '');

    let currentTab = 'explore';
    let activeMovieId = null;
    let recommendationRefresh = 0;

    function showTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
      $(`sec-${tabId}`).classList.remove('hidden');
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('tab-active', 'text-blue-500'));
      document.querySelectorAll('nav button').forEach(b => b.classList.add('text-slate-500'));
      $(`tab-${tabId}`).classList.add('tab-active', 'text-blue-500');
      $(`tab-${tabId}`).classList.remove('text-slate-500');
      document.querySelectorAll('aside button').forEach(b => {
        b.classList.remove('bg-slate-900', 'text-white');
        b.classList.add('text-slate-400');
      });
      $(`dt-tab-${tabId}`).classList.add('bg-slate-900', 'text-white');
      $(`dt-tab-${tabId}`).classList.remove('text-slate-400');
      $('hero').style.display = tabId === 'explore' ? 'block' : 'none';
      currentTab = tabId;
      if (tabId === 'library') loadSaved();
      if (tabId === 'recs') recommend();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleSearch() {
      const container = $('searchContainer');
      if (container.classList.contains('hidden')) {
        container.classList.remove('hidden');
        container.classList.add('fixed', 'inset-x-0', 'top-0', 'bg-slate-950', 'p-4', 'z-[100]', 'animate-in');
        $('search').focus();
      } else {
        container.classList.add('hidden');
        container.classList.remove('fixed', 'inset-x-0', 'top-0', 'bg-slate-950', 'p-4', 'z-[100]', 'animate-in');
      }
    }

    async function api(path, opts = {}) {
      if (LOCAL_BACKEND?.enabled) {
        return LOCAL_BACKEND.request(path, opts);
      }

      try {
        const res = await fetch(API_BASE + path, {
          headers: { "Content-Type": "application/json" },
          ...opts
        });
        if (!res.ok) throw new Error(await res.text() || res.statusText);
        return res.json();
      } catch (err) {
        if (LOCAL_BACKEND) {
          $('backend-url').textContent = 'in-app local';
          return LOCAL_BACKEND.request(path, opts);
        }
        showToast("Connection Error", "Check backend", "error");
        throw err;
      }
    }

    async function trackBehavior(contentId, interactionType, dwellTime = null, scrollPosition = null, context = "") {
      try {
        if (LOCAL_BACKEND?.enabled) {
          await LOCAL_BACKEND.request('/api/behavior/track', {
            method: 'POST',
            body: JSON.stringify({
              user_id: userId,
              content_id: contentId,
              interaction_type: interactionType,
              dwell_time: dwellTime,
              scroll_position: scrollPosition,
              context: context
            })
          });
          return;
        }

        await fetch(`${API_BASE}/api/behavior/track`, {
          method: 'POST',
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            user_id: userId,
            content_id: contentId,
            interaction_type: interactionType,
            dwell_time: dwellTime,
            scroll_position: scrollPosition,
            context: context
          })
        });
      } catch (err) {
        // Silently fail behavior tracking to not disrupt user experience
        console.log('Behavior tracking failed:', err);
      }
    }

    // Dwell time tracking
    const cardViewTimes = new Map();
    const viewThreshold = 2000; // 2 seconds minimum to count as a view

    function setupDwellTracking(card, contentId) {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            cardViewTimes.set(contentId, Date.now());
          } else {
            const startTime = cardViewTimes.get(contentId);
            if (startTime) {
              const dwellTime = (Date.now() - startTime) / 1000; // Convert to seconds
              if (dwellTime >= viewThreshold / 1000) {
                trackBehavior(contentId, 'dwell', dwellTime, null, JSON.stringify({ threshold_met: true }));
              }
              cardViewTimes.delete(contentId);
            }
          }
        });
      }, { threshold: 0.5 }); // Track when 50% of card is visible

      observer.observe(card);
      return observer;
    }

    function showToast(title, sub, type = "success") {
      const toast = $('toast');
      const icon = $('toastIcon');
      $('toastTitle').textContent = title;
      $('toastSub').textContent = sub;
      icon.className = `w-10 h-10 rounded-xl flex items-center justify-center ${type === 'error' ? 'bg-rose-500/20 text-rose-500' : 'bg-emerald-500/20 text-emerald-500'}`;
      icon.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i>`;
      toast.classList.remove('translate-x-[120%]', 'opacity-0');
      setTimeout(() => toast.classList.add('translate-x-[120%]', 'opacity-0'), 3000);
    }

    function openReflection(id, title, currentReflection = "") {
      activeMovieId = id;
      $('modalMovieTitle').textContent = title;
      $('reflectionText').value = currentReflection;
      $('reflectionOverlay').classList.remove('hidden');
      $('reflectionText').focus();
    }

    window.addToLibrary = function(id, title, event, currentReflection = "") {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      trackBehavior(id, 'recommendation_click');
      openReflection(id, title, currentReflection);
    }

    function closeReflection() {
      $('reflectionOverlay').classList.add('hidden');
      activeMovieId = null;
    }

    function openReport() {
      $('reportOverlay').classList.remove('hidden');
      $('reportMessage').focus();
    }

    function closeReport() {
      $('reportOverlay').classList.add('hidden');
      $('reportMessage').value = "";
    }

    $('btnSendReport').onclick = async () => {
      const message = $('reportMessage').value.trim();
      if (!message) {
        showToast("Report Empty", "Add a message first", "error");
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/api/reports`, {
          method: 'POST',
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            user_id: userId,
            category: $('reportCategory').value,
            message
          })
        });
        if (!res.ok) throw new Error(await res.text() || res.statusText);
        showToast("Report Sent", "Admin can review it");
        closeReport();
      } catch (err) {
        showToast("Report Failed", "Check connection", "error");
      }
    };

    $('btnSaveReflection').onclick = async () => {
      const text = $('reflectionText').value;
      try {
        await api(`/api/watchlist/save`, {
          method: 'POST',
          body: JSON.stringify({ content_id: activeMovieId, liked: true, reflection: text })
        });
        showToast("Added to Library", "AI will learn from your preferences");
        closeReflection();
        if (currentTab === 'library') loadSaved();
        if (currentTab === 'explore') doSearch();
      } catch (e) {}
    };

    function svgEscape(value) {
      return String(value || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function generatedPosterDataUrl(item) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900">
        <rect width="600" height="900" fill="#0f172a"/>
        <text x="300" y="450" text-anchor="middle" fill="#334155" font-size="40" font-family="sans-serif" font-weight="bold">${svgEscape(item.title)}</text>
      </svg>`;
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }

    function posterSources(item) {
      const sources = [];
      if (item.poster_data_url) {
        sources.push(item.poster_data_url);
      }
      const url = item.image_url;
      if (url) {
        // Try direct URL first (TMDB supports CORS)
        sources.push(url);
        // Fallback to weserv.nl proxy if direct URL fails
        const cleanUrl = url.replace(/^https?:\/\//, '');
        sources.push(`https://images.weserv.nl/?url=${encodeURIComponent(cleanUrl)}&w=600&h=900&fit=cover`);
      }
      sources.push(generatedPosterDataUrl(item));
      return sources;
    }

    function jsArg(value) {
      return JSON.stringify(value || "").replace(/'/g, "&#39;");
    }

    window.tryNextPosterSource = function(img) {
      const sources = JSON.parse(img.dataset.sources || '[]');
      let nextIndex = Number(img.dataset.sourceIndex || 0) + 1;
      if (nextIndex < sources.length) {
        img.dataset.sourceIndex = String(nextIndex);
        img.src = sources[nextIndex];
      } else {
        const fb = img.parentElement.querySelector('.img-fallback');
        if(fb) fb.classList.remove('hidden');
        img.classList.add('hidden');
      }
    }

    function createCard(it, savedData = null) {
      const el = document.createElement('div');
      const sources = posterSources(it);
      const encodedSources = JSON.stringify(sources).replace(/"/g, '&quot;');
      
      // Track view when card is created
      if (currentTab === 'recs') {
        trackBehavior(it.id, 'view', null, null, JSON.stringify({ source: 'recommendations' }));
      }

      if (currentTab === 'library' && savedData) {
        el.className = 'bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden flex flex-col shadow-xl animate-in';
        el.innerHTML = `
          <div class="flex gap-4 p-4">
            <div class="relative w-24 aspect-[2/3] rounded-xl overflow-hidden shadow-lg border border-slate-800 flex-shrink-0">
               <div class="absolute inset-0 bg-slate-800 animate-pulse img-loading"></div>
               <div class="absolute inset-0 bg-slate-900 hidden img-fallback flex items-center justify-center p-2"><i class="fas fa-film text-xl text-slate-700"></i></div>
               <img src="${sources[0]}" data-sources="${encodedSources}" data-source-index="0" class="w-full h-full object-cover opacity-0 transition-opacity" onload="this.classList.remove('opacity-0'); this.parentElement.querySelector('.img-loading')?.remove()" onerror="tryNextPosterSource(this)">
            </div>
            <div class="flex-1 min-w-0 text-left">
              <span class="text-[9px] font-black text-blue-500 uppercase mb-1 block">${it.kind}</span>
              <h3 class="font-bold text-lg leading-tight truncate mb-2 text-white">${it.title}</h3>
              <p class="text-[10px] text-slate-500 truncate text-white">${it.genres}</p>
            </div>
          </div>
          <div class="px-4 pb-4">
            <div class="bg-slate-950/50 rounded-2xl p-4 border border-slate-800/50 min-h-[120px] relative text-left">
              <button onclick="addToLibrary(${it.id}, ${jsArg(it.title)}, event, ${jsArg(savedData.reflection || '')})" class="absolute top-3 right-3 text-slate-600 hover:text-white transition-colors text-xs text-white"><i class="fas fa-pen"></i></button>
              <p class="text-sm text-slate-300 italic leading-relaxed line-clamp-4 text-white">${savedData.reflection || 'No notes added yet...'}</p>
            </div>
          </div>`;
      } else {
        el.className = 'group card-zoom cursor-pointer transition-all duration-300';
        el.onclick = (event) => addToLibrary(it.id, it.title, event);
        const scoreBadge = it.score ? `<div class="absolute top-2 left-2 bg-blue-600 text-[9px] font-black px-1.5 py-0.5 rounded shadow-lg z-10 text-white">MATCH ${Math.round(it.score*100)}%</div>` : '';
        el.innerHTML = `
          <div class="relative aspect-[2/3] rounded-2xl overflow-hidden mb-3 shadow-lg border border-slate-800 group-hover:border-blue-500/50 transition-all">
            <div class="absolute inset-0 bg-slate-800 animate-pulse img-loading"></div>
            <div class="absolute inset-0 bg-slate-900 hidden img-fallback flex items-center justify-center p-4 text-center"><i class="fas fa-film text-3xl text-slate-700"></i></div>
            <img src="${sources[0]}" data-sources="${encodedSources}" data-source-index="0" class="absolute inset-0 w-full h-full object-cover group-hover:scale-110 transition-transform duration-500 opacity-0 transition-opacity" onload="this.classList.remove('opacity-0'); this.parentElement.querySelector('.img-loading')?.remove()" onerror="tryNextPosterSource(this)">
            ${scoreBadge}
            <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/30 to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex flex-col justify-end p-4 text-center">
               <p class="text-[10px] text-slate-200 line-clamp-3 mb-4 font-medium italic text-white">"${it.synopsis || ''}"</p>
               <button onclick="addToLibrary(${it.id}, ${jsArg(it.title)}, event)" class="w-full py-2.5 bg-blue-600 text-white text-[10px] font-black rounded-xl uppercase shadow-xl shadow-blue-900/40 text-white">Add to Library</button>
            </div>
          </div>
          <div>
            <h3 class="font-bold text-xs truncate mb-1 group-hover:text-blue-400 transition-colors text-white text-left">${it.title}</h3>
            <div class="flex items-center justify-between text-left">
              <span class="text-[9px] text-slate-500 font-bold uppercase tracking-tighter text-white">${it.kind}</span>
              ${it.genres === 'Internet Result' ? '<span class="text-[8px] bg-blue-900/30 text-blue-400 px-1.5 py-0.5 rounded font-bold uppercase tracking-tighter border border-blue-500/20">Live</span>' : ''}
            </div>
          </div>`;
      }
      
      // Set up dwell time tracking
      setupDwellTracking(el, it.id);
      
      return el;
    }

    async function loadSaved() {
      const host = $("savedList");
      host.innerHTML = Array(4).fill(0).map(() => `<div class="h-48 rounded-3xl skeleton"></div>`).join('');
      try {
        const savedData = await api(`/api/watchlist?user_id=${encodeURIComponent(userId)}`);
        $('libraryCount').textContent = `${savedData.length} items`;
        if (!savedData.length) { host.innerHTML = `<div class="col-span-full py-20 text-center text-slate-600"><p class="text-sm text-white">Your library is empty</p></div>`; return; }
        const catalogData = await api(`/api/catalog`);
        const byId = new Map(catalogData.map(c => [c.id, c]));
        host.innerHTML = "";
        savedData.forEach(s => { const it = byId.get(s.content_id); if (it) host.appendChild(createCard(it, s)); });
      } catch (e) { host.innerHTML = ""; }
    }

    async function recommend(refresh = false) {
      if (refresh) {
        recommendationRefresh += 1;
      }

      const host = $("recsResults");
      host.innerHTML = Array(5).fill(0).map(() => `<div class="aspect-[2/3] rounded-2xl skeleton"></div>`).join('');
      try {
        const data = await api(`/api/recommendations?user_id=${encodeURIComponent(userId)}&limit=${$("limit").value}&refresh=${recommendationRefresh}`);
        host.innerHTML = "";
        if (!data.recommendations.length) { host.innerHTML = `<div class="col-span-full py-20 text-center text-slate-600"><p class="text-sm text-white">Save reflections to get picks</p></div>`; return; }
        data.recommendations.forEach(r => host.appendChild(createCard(r)));
      } catch (e) { host.innerHTML = ""; }
    }

    async function doSearch() {
      const q = $("search").value.trim();
      const host = $("searchResults");
      try {
        const items = q ? await api(`/api/catalog/search?q=${encodeURIComponent(q)}`) : (await api(`/api/catalog`)).slice(0, 15);
        
        // Track search behavior
        if (q) {
          trackBehavior(0, 'search', null, null, JSON.stringify({ query: q, result_count: items.length }));
        }
        
        host.innerHTML = "";
        items.length ? items.forEach(it => host.appendChild(createCard(it))) : host.innerHTML = `<div class="col-span-full text-center text-slate-500 py-10 text-white">No results found</div>`;
      } catch (e) {}
    }

    async function loadPopular() {
      const host = $("popularMovies");
      try {
        const items = await api(`/api/catalog/popular?limit=10`);
        host.innerHTML = "";
        
        items.forEach(it => {
          const sources = posterSources(it);
          const encodedSources = JSON.stringify(sources).replace(/"/g, '&quot;');
          
          const card = document.createElement('div');
          card.className = 'flex-shrink-0 w-24 cursor-pointer group';
          card.onclick = (event) => addToLibrary(it.id, it.title, event);
          card.innerHTML = `
            <div class="relative aspect-[2/3] rounded-xl overflow-hidden shadow-lg border border-slate-800 group-hover:border-blue-500/50 transition-all">
              <div class="absolute inset-0 bg-slate-800 animate-pulse img-loading"></div>
              <div class="absolute inset-0 bg-slate-900 hidden img-fallback flex items-center justify-center p-2"><i class="fas fa-film text-sm text-slate-700"></i></div>
              <img src="${sources[0]}" data-sources="${encodedSources}" data-source-index="0" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300 opacity-0 transition-opacity" onload="this.classList.remove('opacity-0'); this.parentElement.querySelector('.img-loading')?.remove()" onerror="tryNextPosterSource(this)">
              <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-end p-2">
                <p class="text-[8px] font-bold text-white line-clamp-2">${it.title}</p>
              </div>
            </div>
          `;
          host.appendChild(card);
        });
      } catch (e) {
        host.innerHTML = `<div class="text-slate-500 text-sm text-white">Failed to load popular movies</div>`;
      }
    }

    let searchTimeout;
    $("search").addEventListener('input', () => { clearTimeout(searchTimeout); searchTimeout = setTimeout(doSearch, 400); });
    $("btnRecommend").addEventListener('click', () => recommend(true));
    (async function init() {
      try {
        await api(`/health`);
        $('dt-status-dot').className = "w-2 h-2 rounded-full bg-green-500";
        showTab('explore');
        doSearch();
        loadPopular();
      } catch (e) {
        $('dt-status-dot').className = "w-2 h-2 rounded-full bg-rose-500";
      }
    })();
  </script>
</body>
</html>
