<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MovieTayo Admin</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b12;
      --panel: #111722;
      --panel-2: #151d2b;
      --line: #263244;
      --text: #edf2f7;
      --muted: #9aa8bc;
      --accent: #4f8cff;
      --ok: #37c978;
      --warn: #ffbf47;
      --bad: #ff5f6d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      background: rgba(8, 11, 18, .92);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 18px; }
    h2 { font-size: 16px; margin-bottom: 12px; }
    h3 { font-size: 14px; margin-bottom: 6px; }
    button, input, select {
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 6px;
      padding: 9px 11px;
      font: inherit;
    }
    button {
      cursor: pointer;
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      font-weight: 700;
    }
    button.secondary { background: var(--panel-2); border-color: var(--line); }
    main {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: calc(100vh - 65px);
    }
    nav {
      border-right: 1px solid var(--line);
      padding: 16px;
      background: #0b1019;
    }
    nav button {
      width: 100%;
      margin-bottom: 8px;
      text-align: left;
      background: transparent;
      border-color: transparent;
      color: var(--muted);
    }
    nav button.active {
      background: var(--panel-2);
      color: white;
      border-color: var(--line);
    }
    section { display: none; padding: 18px; }
    section.active { display: block; }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .card, .table-wrap {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
    }
    .metric {
      font-size: 28px;
      font-weight: 800;
      margin-top: 8px;
    }
    .muted { color: var(--muted); }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .row > input, .row > select { max-width: 340px; width: 100%; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      text-align: left;
    }
    th {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 3px 8px;
      background: var(--panel-2);
      color: var(--muted);
      font-size: 12px;
      margin: 2px 4px 2px 0;
    }
    .yes { color: var(--ok); }
    .no { color: var(--bad); }
    .status-new { color: var(--warn); }
    .status-resolved { color: var(--ok); }
    .message { max-width: 520px; white-space: pre-wrap; }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      nav { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      nav button { width: auto; white-space: nowrap; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>MovieTayo Admin</h1>
      <p class="muted">Database, reports, users, and movie preference insights</p>
    </div>
    <div class="row" style="margin:0">
      <input id="token" type="password" placeholder="Admin token">
      <button id="saveToken">Unlock</button>
    </div>
  </header>

  <main>
    <nav>
      <button class="active" data-tab="dashboard">Dashboard</button>
      <button data-tab="reports">Reports</button>
      <button data-tab="users">Users</button>
      <button data-tab="catalog">Catalog</button>
      <button data-tab="behavior">Behavior</button>
    </nav>

    <section id="dashboard" class="active">
      <div class="grid" id="metrics"></div>
      <div class="grid">
        <div class="card">
          <h2>Top Saved Genres</h2>
          <div id="topGenres" class="muted">No data yet</div>
        </div>
        <div class="card">
          <h2>Top Saved Movies</h2>
          <div id="topMovies" class="muted">No data yet</div>
        </div>
      </div>
    </section>

    <section id="reports">
      <div class="row">
        <select id="reportStatus">
          <option value="">All reports</option>
          <option value="new">New</option>
          <option value="reviewing">Reviewing</option>
          <option value="resolved">Resolved</option>
        </select>
        <button id="refreshReports">Refresh</button>
      </div>
      <div class="table-wrap"><table id="reportsTable"></table></div>
    </section>

    <section id="users">
      <div class="table-wrap"><table id="usersTable"></table></div>
    </section>

    <section id="catalog">
      <div class="row">
        <input id="catalogSearch" placeholder="Search title, genre, keyword">
        <button id="refreshCatalog">Search</button>
      </div>
      <div class="table-wrap"><table id="catalogTable"></table></div>
    </section>

    <section id="behavior">
      <div class="table-wrap"><table id="behaviorTable"></table></div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const tokenInput = $('token');
    tokenInput.value = localStorage.getItem('movietayo.admin.token') || 'admin';

    function headers() {
      return { 'Content-Type': 'application/json', 'X-Admin-Token': tokenInput.value };
    }

    async function api(path, options = {}) {
      const res = await fetch(path, { headers: headers(), ...options });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function renderTable(id, columns, rows) {
      const table = $(id);
      table.innerHTML = `
        <thead><tr>${columns.map((col) => `<th>${esc(col.label)}</th>`).join('')}</tr></thead>
        <tbody>${rows.map((row) => `<tr>${columns.map((col) => `<td>${col.render ? col.render(row) : esc(row[col.key])}</td>`).join('')}</tr>`).join('')}</tbody>
      `;
    }

    function pills(items, key = 'genre') {
      return (items || []).map((item) => `<span class="pill">${esc(item[key])} ${item.count ? `(${item.count})` : ''}</span>`).join('') || '<span class="muted">None</span>';
    }

    async function loadDashboard() {
      const data = await api('/api/admin/stats');
      const metricDefs = [
        ['Catalog', data.catalog_items],
        ['Users', data.users],
        ['Saved Items', data.saved_items],
        ['Open Reports', data.open_reports],
        ['Behavior Events', data.behavior_events],
        ['All Reports', data.reports],
      ];
      $('metrics').innerHTML = metricDefs.map(([label, value]) => `<div class="card"><p class="muted">${esc(label)}</p><div class="metric">${esc(value)}</div></div>`).join('');
      $('topGenres').innerHTML = pills(data.top_genres);
      $('topMovies').innerHTML = (data.top_movies || []).map((item) => `<div><strong>${esc(item.title)}</strong> <span class="muted">${item.saved_count} saves</span></div>`).join('') || 'No saved movies yet';
    }

    async function loadReports() {
      const status = $('reportStatus').value;
      const rows = await api(`/api/admin/reports${status ? `?status=${encodeURIComponent(status)}` : ''}`);
      renderTable('reportsTable', [
        { label: 'ID', key: 'id' },
        { label: 'User', key: 'user_id' },
        { label: 'Category', key: 'category' },
        { label: 'Message', render: (row) => `<div class="message">${esc(row.message)}</div>` },
        { label: 'Status', render: (row) => `<strong class="status-${esc(row.status)}">${esc(row.status)}</strong>` },
        { label: 'Created', render: (row) => esc(row.created_at ? new Date(row.created_at).toLocaleString() : '') },
        { label: 'Action', render: (row) => `
          <select data-report="${row.id}">
            ${['new', 'reviewing', 'resolved'].map((status) => `<option value="${status}" ${status === row.status ? 'selected' : ''}>${status}</option>`).join('')}
          </select>` },
      ], rows);
      document.querySelectorAll('[data-report]').forEach((select) => {
        select.addEventListener('change', async () => {
          await api(`/api/admin/reports/${select.dataset.report}`, {
            method: 'PATCH',
            body: JSON.stringify({ status: select.value }),
          });
          await Promise.all([loadReports(), loadDashboard()]);
        });
      });
    }

    async function loadUsers() {
      const rows = await api('/api/admin/users');
      renderTable('usersTable', [
        { label: 'User', key: 'user_id' },
        { label: 'Saved', key: 'saved_count' },
        { label: 'Events', key: 'behavior_count' },
        { label: 'Reports', key: 'report_count' },
        { label: 'Top Genres', render: (row) => pills(row.top_genres) },
        { label: 'Recent Searches', render: (row) => (row.recent_searches || []).map(esc).join(', ') || '<span class="muted">None</span>' },
      ], rows);
    }

    async function loadCatalog() {
      const q = $('catalogSearch').value.trim();
      const rows = await api(`/api/admin/catalog?limit=120${q ? `&q=${encodeURIComponent(q)}` : ''}`);
      renderTable('catalogTable', [
        { label: 'ID', key: 'id' },
        { label: 'Title', key: 'title' },
        { label: 'Kind', key: 'kind' },
        { label: 'Genres', key: 'genres' },
        { label: 'Image URL', render: (row) => row.has_image_url ? '<span class="yes">yes</span>' : '<span class="no">missing</span>' },
        { label: 'Poster Data', render: (row) => row.has_poster_data ? '<span class="yes">yes</span>' : '<span class="no">missing</span>' },
      ], rows);
    }

    async function loadBehavior() {
      const rows = await api('/api/admin/behavior?limit=120');
      renderTable('behaviorTable', [
        { label: 'Time', render: (row) => esc(row.created_at ? new Date(row.created_at).toLocaleString() : '') },
        { label: 'User', key: 'user_id' },
        { label: 'Type', key: 'interaction_type' },
        { label: 'Movie', render: (row) => esc(row.title || row.content_id) },
        { label: 'Dwell', render: (row) => row.dwell_time ? `${Number(row.dwell_time).toFixed(1)}s` : '' },
        { label: 'Context', render: (row) => `<code>${esc(JSON.stringify(row.context || {}))}</code>` },
      ], rows);
    }

    const loaders = { dashboard: loadDashboard, reports: loadReports, users: loadUsers, catalog: loadCatalog, behavior: loadBehavior };
    document.querySelectorAll('nav button').forEach((button) => {
      button.addEventListener('click', async () => {
        document.querySelectorAll('nav button').forEach((item) => item.classList.remove('active'));
        document.querySelectorAll('section').forEach((item) => item.classList.remove('active'));
        button.classList.add('active');
        $(button.dataset.tab).classList.add('active');
        await loaders[button.dataset.tab]();
      });
    });
    $('saveToken').onclick = async () => {
      localStorage.setItem('movietayo.admin.token', tokenInput.value);
      await loadAll();
    };
    $('refreshReports').onclick = loadReports;
    $('reportStatus').onchange = loadReports;
    $('refreshCatalog').onclick = loadCatalog;
    $('catalogSearch').addEventListener('keydown', (event) => { if (event.key === 'Enter') loadCatalog(); });

    async function loadAll() {
      try {
        await Promise.all([loadDashboard(), loadReports(), loadUsers(), loadCatalog(), loadBehavior()]);
      } catch (err) {
        alert('Admin API error. Check token/backend. ' + err.message);
      }
    }
    loadAll();
  </script>
</body>
</html>
